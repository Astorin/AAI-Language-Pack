[mod-name]
aai-vehicles-ironclad=AAI Vehicles: Ironclad (Cuirassé)

[mod-description]
aai-vehicles-ironclad=Un bateau renforcé en métal lourdement armé avec un mortier de longue portée et un canon de tank. Sa grande capacité d'inventaire lui permet de transporter des objets entre des îles. Son arme peut utiliser à la fois des obus pour mortier et pour tank. Pour embarqué et débarquer du Cuirassé, il vaut mieux le faire dans des eaux peu profondes (mod "Alien Biomes").

[item-name]
mortar-bomb=Obus de mortier
mortar-cluster-bomb=Obus de mortier à fragmentation
ironclad-cannon=Canon
ironclad-mortar=Mortier

[item-description]
mortar-bomb=Un explosif à très longue portée tiré en arc.
mortar-cluster-bomb=Un explosif à longue portée tiré en arc, qui se fragmente au contact.
ironclad-cannon=Tire des obus de tank en ligne droite à moyenne portée.
ironclad-mortar=Tire des obus de mortier à longue portée et avec une trajectoire courbe.

