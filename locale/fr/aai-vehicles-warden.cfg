[item-description]
vehicle-warden=Un véhicule de support à haute capacité équipé d'un radar. Capable de lancer des impulsions électriques, de collecter des objets au sol dans une grande zone, et de réparer les véhicules et constructions à proximité avec des kits de réparation. Avec AAI Programmable Vehicles, il permet d'approvisionner les véhicules à proximité comme un Transporteur, mais dans un rayon beaucoup plus grand.
electro-bolter-gun=Utilise des munitions pour électrochocs
electroshock-pulse-ammo=Une charge électrique de zone conçue pour étourdir et immobiliser les ennemis biologiques. Utilisée par le canon à électrochocs des Gardiens.

