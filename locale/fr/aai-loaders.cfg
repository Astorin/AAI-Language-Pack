[mod-setting-name]
aai-loaders-mode=Mode de fonctionnement
aai-loaders-lubricant-recipe=Ajouter une recette de lubrifiant
aai-loaders-fit-assemblers=Ajuster les machines d'assemblage
aai-loaders-belt-stacking-mode=Mode d'empilement des objets [space-age]

[mod-setting-description]
aai-loaders-mode=Détermine le mode de fonctionnement les chargeurs d'AAI. "Lubrifié" est le mode recommendé; sinon, même avec un coût élevé, les chargeurs ont trop d'avantages comparés aux bras robotisés.
aai-loaders-lubricant-recipe=Rajoute ou non une recette simple mais inefficace pour produire du lubrifiant à partir de pétrole brut.\n\nL'option par défaut est "Auto", qui rajoute conditionnellement cette recette si les recettes de raffinage du pétrole avancé et de lubrifiant à partir d'huile lourde sont inchangées par rapport au jeu de base. Cette option n'a aucun effet si l'option "mode de fonctionnement" n'est pas réglé sur "lubrifié".
aai-loaders-fit-assemblers=Augmente la taille des machines d'assemblage de 8% pour que les sprites des chargeurs y soit correctement connectés.
aai-loaders-belt-stacking-mode=Cette option ne fait rien sans un mod qui ajoute l'empilement d'objets sur les convoyeurs.

[string-mod-setting]
aai-loaders-mode-lubricated=Lubrifié
aai-loaders-mode-expensive=Cher (Sans fluide)
aai-loaders-mode-graphics-only=Graphismes seulement
aai-loaders-lubricant-recipe-auto=Automatique
aai-loaders-lubricant-recipe-enabled=Activé
aai-loaders-lubricant-recipe-disabled=Désactivé
aai-loaders-belt-stacking-mode-off=Désactivé
aai-loaders-belt-stacking-mode-opt-in=Autorisé
aai-loaders-belt-stacking-mode-opt-out=Non-autorisé

[string-mod-setting-description]
aai-loaders-mode-lubricated=Equilibré par un coût logistique et une consommation de fluide.
aai-loaders-mode-expensive=Equilibré par le coût de fabrication. Pas d'usage de fluide.
aai-loaders-mode-graphics-only=Aucun changement de gameplay. Fournit seulement les graphismes pour d'autres mods.
aai-loaders-lubricant-recipe-auto=Une recette supplémentaire pour transformer le pétrole en lubrifiant est ajouté si les recettes de raffinage avancé et de lubrifiant sont inchangées par rapport au jeu de base.
aai-loaders-lubricant-recipe-enabled=Une recette supplémentaire pour transformer le pétrole en lubrifiant est ajouté.
aai-loaders-lubricant-recipe-disabled=Une recette supplémentaire pour transformer le pétrole en lubrifiant n'est pas disponible.
aai-loaders-belt-stacking-mode-off=Empilement d'objets désactivé. (réinitialise la taille des piles d'objets)
aai-loaders-belt-stacking-mode-opt-in=Empilement d'objets activé, cependant les chargeurs n'empilent pas les objets par défaut.
aai-loaders-belt-stacking-mode-opt-out=Empilement d'objets activé, tous les chargeurs vont empiler les objets par défaut.

[recipe-name]
lubricant-from-crude-oil=Lubrifiant à partir de pétrol brut

