vehicle-mining-multiplier=Véhicule de Minage: Multiplicateur de Vitesse de Minage
vehicle-mining-disallow-resources=Véhicule de Minage: Interdire l'Extraction de Ressources
vehicle-mining-interval=Véhicule de Minage: Intervalle de Minage
vehicle-mining-requires-movement=Véhicule de Minage: le Minage Nécessite un Déplacement
