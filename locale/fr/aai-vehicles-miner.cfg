[mod-setting-description]
start-with-vehicle-miner=Ajoute un véhicule de minage MK1 à l'inventaire du vaisseau de départ en mode freeplay.
vehicle-mining-multiplier=Un multiplicateur de vitesse de minage pour les véhicules de minage. Une valeur de 50 signifie que les véhicules mineront deux fois moins vite.
vehicle-mining-disallow-resources=Entrez les noms de ressource au format "ressource-name" pour empêcher leur récolte par véhicule. Plusieurs noms sont à séparer par des espaces. Vous pouvez trouver les noms exacts grâce aux options de tooltip dans le menu F4 de débuggage.
vehicle-mining-interval=Le nombre de ticks entre les opérations de minage. Un nombre bas rend le minage fluide, un nombre haut améliore les performances.
vehicle-mining-requires-movement=Le véhicule ne peut miner qu'en se déplaçant, en étant conduit soit par un joueur, soit par une IA de véhicules (par exemple, avec l'outil chemin de AAI Programmable Vehicles).
vehicle-collection-interval=Le nombre de ticks entre les intéractions avec les arbres, les rochers et les objets au sol. Un nombre bas augmente la fréquence d'action, un nombre haut améliore les performances.


