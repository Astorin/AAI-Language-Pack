[item-description]
tile-scan=Entrez un signal "Distance" pour scanner aléatoirement des cases à portée de cette distance. Pour scanner une case spécifique, entrez des signaux X-Case et Y-Case. Utilisez un signal "Distance" avec des coordonnées de case XY pour scanner les cases autour de la case (X,Y). Renvoie la position de la case scannée avec tous les ennemis, ressources, structures, unités, véhicules et sols présents sur cette case.
zone-scan=Entrez un type de zone, le nombre d'entrée sélectionne la case de la n-ième zone de ce type. Utilisez une valeur négative pour sélectionner une case de zone dans l'ordre inverse. Renvoie la position de la case de zone.
zone-control=Entrez des coordonnées X-case et Y-case pour supprimer les zones d'une case donnée. Si un type de zone est aussi en entrée, alors une zone de ce type est placé sur la case spécifiée.
unit-scan=Entrez un ID de joueur (onglet Signaux Virtuels), selectionnez le n-ième joueur par index ou utilisez une valeur négative pour sélectionner en ordre inverse (le plus récent en premier). Renvoie en sortie les détails du joueur sélectionné s'il est trouvé, notamment la position, la santé et l'inventaire.
unit-control=Entrez un ID de véhicule, comme avec le scanneur d'unité, plus un signal de commande. Les signaux de commande directs sont "Angle" et "Vitesse", ou des coordonnées de sous-case X et Y pour calculer un vecteur (convertit en un angle et une vitesse). Envoyez une commande de pathfinding indirecte avec des coordonnées de case XY (en utilisant l'IA des biters, donc c'est un peu bête).
unitdata-scan=Entrez un ID de véhicule ou de joueur (onglet Signaux Virtuels), sélectionnez la n-ième entité de ce type dans l'ordre de placement, ou utilisez une valeur négative pour sélectionner en ordre inverse (plus récent en premier). Renvoie les données stockées dans le véhicule. Les signaux stockés sont utilisés pour cibler les objets dans l'inventaire des véhicules lors des interactions avec les Transporteurs, ou ils peuvent être utilisés pour différentier les unités, signifier des rôles, etc.
unitdata-control=Entrez un ID de véhicule, comme avec un scanneur de données d'unité, plus n'importe quels signaux que vous souhaitez sauvegarder dans le véhicule cible. Le signal en entrée va écraser TOUS les signaux actuellement sauvegardés dans le véhicule. Si vous voulez modifier les signaux existants, alors il faut d'abord scanner les données du véhicule, réaliser les changements, puis sauvegarder à nouveau les signaux modifiés dans le véhicule.
path-scan=Entrez un ID de chemin pour obtenir le nombre de balises, ou un ID de chemin et de balise pour scanner une cible balisée spécifique. Renvoie les coordonnées XY de la position d'une balise, ou l'ID de la cible pour les balises dynamiques.
path-control=Entrez un ID de chemin et un ID de balise pour assigner des données à la balise. Une donnée vide supprime la balise. Des coordonnées XY définissent une position statique. Vous pouvez définir une balise dynamique avec un ID de joueur, d'unité, de balise de position ou d'entrepôt de véhicules.

