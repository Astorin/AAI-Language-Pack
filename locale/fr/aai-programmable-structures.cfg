[aai-structure-settings]
structure_settings=__1__
save=OK
output-filtering=Filtre de Sortie
tick_limit=Fréquence de Tick
tick_limit-tooltip=Ne réaliser un traitement que tous les X ticks. 60 = une fois par seconde. 0 = désactivé. Un nombre élevé ralentira moins le jeu, mais utiliser peu de structure offre un meilleur gain de performance.
output_pulse=Sortie pulsée
output_pulse-tooltip=Si coché, les signaux en sortie seront émis sur 1 tick lorsqu'ils sont scannés puis désactivés jusqu'au prochain tick de scan (défini par la fréquence de tick). Si non coché, les signaux persistent jusqu'au prochain scan.
quantity=Quantité
quantity-tooltip=Signal de quantité de quelque chose. Représente en général le nombre d'entités d'un type donné pour une surface donnée.
surface=Surface
surface-tooltip=ID d'une surface de jeu. Chaque surface est un monde déconnecté.
unit_id=ID de l'unité
unit_id-tooltip=ID unique d'une unité. Cet ID est unique et indépendant de la surface.
type_id=ID de Type
type_id-tooltip=Signal d'ID d'un type. Se base sur l'ID de la n-ième unité vivante d'un type sur une surface (ou sur l'ID d'un joueur quelle que soit la surface).
xy_tile=Case
xy_tile-tooltip=X-Case et Y-Case
xy_subtile=Sous-case
xy_subtile-tooltip=X-Sous-Case et Y-Sous-Case
physical=Propriétés Physiques
physical-tooltip=Angle et Vitesse
stat=Statistiques d'Unité
stat-tooltip=Santé, Énergie, Pourcentage de Batterie
timer=Timer
timer-tooltip=Temps écoulé depuis: Case Atteinte, Cible Verrouillée, Commande Émise
inventory_space=Place dans l'Inventaire
inventory_space-tooltip=Nombre d'emplacements d'inventaire vides
inventory=Inventaire
inventory-tooltip=Contenu de l'Inventaire et des emplacements de Carburant et Munitions
zone=Zone Actuelle
zone-tooltip=Type et ID de la Zone Actuelle
terrain=Terrain
terrain-tooltip=Terre ferme, Eau, Sols
resource=Ressources
resource-tooltip=Minerais, Bois, Fluides
entity=Entités
entity-tooltip=Ennemies, Structures, Unités, Falaises, Objets au Sol
unitdata=Donnée d'Unité
unitdata-tooltip=Les signaux stockés sont utilisés pour cibler les objets dans l'inventaire des véhicules lors des interactions avec les Transporteurs, ou peuvent être utilisés pour différentier les unités, spécifier des rôles, etc.
path_id=ID du Chemin
path_id-tooltip=L'ID du chemin scanné. Transmis en tant que signal "Chemin". Les IDs de chemins sont dépendants de la surface.
path_quantity=Quantité de Chemin
path_quantity-tooltip=Le nombre de chemins définis par cette force pour une surface donnée. Transmis sur le signal P.
waypoint_id=ID de Balise
waypoint_id-tooltip=L'ID de la balise scannée. Transmis en tant que signal "Balise".
waypoint_quantity=Quantité de Balises
waypoint_quantity-tooltip=Le nombre de balises définies sur un chemin scanné. Transmis sur le signal W.
target=Cible
target-tooltip=La cible attachée à la balise (s'il y en a une). Renvoît la balise de position, l'entrepot de véhicules, le joueur ou l'ID de l'unité, choisit comme cible.
misc=Divers
misc-tooltip=Autres données diverses.

