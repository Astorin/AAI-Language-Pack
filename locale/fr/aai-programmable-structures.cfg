[technology-name]
programmable-structures=Structures programmables

[technology-description]
programmable-structures=Scannez des cases pour détecter des ressources, des ennemis et des structures. Placez des zones automatiquement sur des coordonnées. Scannez les positions des cases de zones. Scannez la position, la santé et l'inventaire de joueurs.

[mod-setting-name]
aai-max-structs-per-tick=AAI - Nombre de structures max par tick
aai-structs-tick_limit=AAI - Fréquence de ticks par défaut
aai-structs-output_pulse=AAI - Sortie pulsée par défaut

[mod-setting-description]
aai-max-structs-per-tick=Améliore les UPS en restreignant le nombre de structures à traiter à chaque frame. Une valeur plus élevée signifie une tension potentielle sur les UPS, 0 signifie illimitée. Si vous choisissez 0, alors il serait une bonne idée de limiter les structures d'autres manières, comme par exemple en coupant leur alimentation électrique lorsque leur fonctionnement n'est pas nécessaire, ou en envoyant des signaux par impulsion plutôt que de manière continue.
aai-structs-tick_limit=AAI - Fréquence de tick par défaut pour les nouvelles structures
aai-structs-output_pulse=AAI - Paramètre de sortie pulsée par défaut pour les nouvelles structures


