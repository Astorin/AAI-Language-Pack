title_aai-signal-transmission=Transmission de Signaux
page_aai-signal-transmission_text_1=Les émetteurs et récepteurs de signaux sont des constructions connectées au réseau logique qui permet la transmission de signaux de circuits logiques à très longue distance en ne consommant qu'un peu d'électricité.\n\nLes signaux de réseaux logiques sont envoyés et réceptionnés en fonction des canaux de transmission. Les signaux émis sur un canal spécifique ne seront reçu que par les récepteurs à l'écoute de ce canal. Il peut y avoir autant de récepteurs de signaux que souhaité sur un même canal ; ils recevront tous le même signal. Il peut y avoir autant d'émetteurs de signaux que souhaités connectés un même canal ; le signal reçu depuis ce canal correspond à la somme des signaux transmis par tous les émetteurs de signaux connecté.\n\nLes entrées logiques Rouge et Verte restent séparée dans chaque canal de bout en bout. Un signal rouge en entrée d'un émetteur sera transmis sur le fil rouge en sortie d'un récepteur.\n\nLes émetteurs et récepteurs de signaux ne fonctionne correctement que lorsqu'il sont à pleine puissance. Si le réseau électrique auquel ils sont branchés est en sous-tension (jaune/rouge dans l'interface de réseau électrique), alors ils ne pourront ni transmettre ni récevoir de signaux.

